[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "realwaste-classifier"
version = "0.1.0"
description = "Reproducible RealWaste image-classification experiments with MobileNetV3 Small and ResNet18"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pillow>=10.2,<13",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
app = [
  "psutil>=6,<8",
  "streamlit>=1.38,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/realwaste", "app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
